[package]
name = "island-lab-native"
version = "0.1.0"
description = "Island Lab desktop capsule - experimental Windows host"
edition = "2021"
rust-version = "1.95"
build = "build.rs"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Foundation", "Media_Control"] }

[build-dependencies]
tauri-build = { version = "2" }
