[package]
name = "snowy-new-year"
version = "0.1.1"
edition = "2021"
rust-version = "1.95"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = [
    "System", "UI_Composition_Desktop", "Win32_System_WinRT_Composition"
] }
windows-numerics = "0.3"
ureq = { version = "2.12", features = ["json"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry",
    "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"
] }

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
resvg = { version = "0.49", default-features = false }
